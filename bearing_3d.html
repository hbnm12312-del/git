<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6205 深沟球轴承 - 3D 展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; font-family: -apple-system, 'Microsoft YaHei', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: #e0e0e0; text-align: center; pointer-events: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        #info h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; letter-spacing: 1px; }
        #info p { font-size: 14px; opacity: 0.7; }
        #legend {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 24px; color: #ccc; font-size: 13px;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px;
            backdrop-filter: blur(6px); pointer-events: none;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
        #hint {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.3); font-size: 13px;
            pointer-events: none; white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>6205 深沟球轴承</h1>
        <p>外径 Ø52 · 内径 Ø25 · 宽度 15 · 滚珠 Ø7.94 × 9 颗</p>
    </div>
    <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#78909c;"></div> 外圈</div>
        <div class="legend-item"><div class="legend-dot" style="background:#90a4ae;"></div> 内圈</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffab40;"></div> 滚珠</div>
    </div>
    <div id="hint">🖱 拖动旋转 · 滚轮缩放</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // === 场景 ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // === 相机 ===
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(45, 30, 55);
        camera.lookAt(0, 0, 0);

        // === 渲染器 ===
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // === 控制器 ===
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 20;
        controls.maxDistance = 150;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.target.set(0, 0, 0);

        // === 灯光 ===
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        mainLight.position.set(30, 50, 30);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.8);
        fillLight.position.set(-30, 10, -30);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
        rimLight.position.set(0, -30, 30);
        scene.add(rimLight);

        const envLight = new THREE.PointLight(0x4466ff, 0.4, 100);
        envLight.position.set(0, 40, 0);
        scene.add(envLight);

        // === 地面（阴影承接） ===
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.ShadowMaterial({ opacity: 0.15, color: 0x000000 }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -16;
        floor.receiveShadow = true;
        scene.add(floor);

        // 地平面网格
        const grid = new THREE.GridHelper(80, 40, 0x446688, 0x335577);
        grid.position.y = -15.5;
        grid.material.transparent = true;
        grid.material.opacity = 0.25;
        scene.add(grid);

        // === 材质 ===
        const outerMat = new THREE.MeshPhysicalMaterial({
            color: 0x78909c, metalness: 0.55, roughness: 0.35,
            clearcoat: 0.1, envMapIntensity: 0.6,
        });
        const innerMat = new THREE.MeshPhysicalMaterial({
            color: 0x90a4ae, metalness: 0.5, roughness: 0.4,
            clearcoat: 0.1, envMapIntensity: 0.5,
        });
        const ballMat = new THREE.MeshPhysicalMaterial({
            color: 0xffab40, metalness: 0.7, roughness: 0.15,
            clearcoat: 0.4, envMapIntensity: 1.0,
        });

        // === 轴承参数 ===
        const ID = 12.5;   // 内圈内半径
        const IO = 18.0;   // 内圈外半径
        const OI = 20.5;   // 外圈内半径
        const OD = 26.0;   // 外圈外半径
        const HW = 7.5;    // 半宽
        const BD = 7.94;   // 滚珠直径
        const PR = 19.25;  // 节圆半径
        const NB = 9;      // 滚珠数量
        const SEG = 64;    // 细分段数

        // --- 工具函数: 旋转体截面（绕 Y 轴） ---
        function createRing(innerR, outerR, halfW, material, label) {
            const shape = new THREE.Shape();
            // 在 XY 平面画截面 (X=半径, Y=高度)，然后绕 Y 轴旋转
            const x1 = innerR, x2 = outerR, y1 = -halfW, y2 = halfW;
            shape.moveTo(x1, y1);
            shape.lineTo(x2, y1);
            shape.lineTo(x2, y2);
            shape.lineTo(x1, y2);
            shape.closePath();

            const geo = new THREE.ShapeGeometry(shape);
            const extrudeSettings = {
                steps: 1,
                bevelEnabled: false,
                extrudePath: new THREE.CurvePath(),
            };

            // 使用 LatheGeometry (绕 Y 轴)
            const points = [
                new THREE.Vector2(x1, y1),
                new THREE.Vector2(x2, y1),
                new THREE.Vector2(x2, y2),
                new THREE.Vector2(x1, y2),
            ];
            // 实际上 LatheGeometry 需要从外到内或从内到外的有序点
            const lathePoints = [
                new THREE.Vector2(x1, y1),
                new THREE.Vector2(x2, y1),
                new THREE.Vector2(x2, y2),
                new THREE.Vector2(x1, y2),
            ];
            const geometry = new THREE.LatheGeometry(lathePoints, SEG);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // --- 外圈 ---
        const outerRing = new THREE.Mesh(
            new THREE.LatheGeometry([
                new THREE.Vector2(OI, -HW),
                new THREE.Vector2(OD, -HW),
                new THREE.Vector2(OD, HW),
                new THREE.Vector2(OI, HW),
            ], SEG),
            outerMat,
        );
        outerRing.castShadow = true;
        outerRing.receiveShadow = true;
        scene.add(outerRing);

        // --- 内圈 ---
        const innerRing = new THREE.Mesh(
            new THREE.LatheGeometry([
                new THREE.Vector2(ID, -HW),
                new THREE.Vector2(IO, -HW),
                new THREE.Vector2(IO, HW),
                new THREE.Vector2(ID, HW),
            ], SEG),
            innerMat,
        );
        innerRing.castShadow = true;
        innerRing.receiveShadow = true;
        scene.add(innerRing);

        // --- 滚珠 ---
        const ballGeo = new THREE.SphereGeometry(BD / 2, 24, 24);
        for (let i = 0; i < NB; i++) {
            const angle = (i / NB) * Math.PI * 2;
            const bx = PR * Math.cos(angle);
            const bz = PR * Math.sin(angle);
            const ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.set(bx, 0, bz);
            ball.castShadow = true;
            ball.receiveShadow = true;
            scene.add(ball);
        }

        // === 窗口自适应 ===
        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // === 动画循环 ===
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 用户交互时暂停自动旋转
        renderer.domElement.addEventListener('pointerdown', () => {
            controls.autoRotate = false;
        });
        renderer.domElement.addEventListener('pointerup', () => {
            setTimeout(() => { controls.autoRotate = true; }, 4000);
        });
    </script>
</body>
</html>
